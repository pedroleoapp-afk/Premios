<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unicoins — Balcão de prêmios</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F7; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#10233A; --muted:#5B6B80; --line:#D3DCE8;
  --blue:#1B5FD1; --blue-ink:#FFFFFF; --gold:#E8B21E; --gold-deep:#9A6C00;
  --fin:#0F7F73; --fin-soft:#DDF2EF; --chat:#5B3FC4; --chat-soft:#E9E4FB;
  --ok:#1E8A4C; --bad:#C2372F; --shadow:0 1px 0 rgba(16,35,58,.06),0 6px 18px -10px rgba(16,35,58,.25);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1524; --surface:#132238; --surface2:#182A44; --ink:#E7EEF7; --muted:#9AAAC0; --line:#24395A;
    --blue:#5B93F0; --blue-ink:#071224; --fin:#3BC2B0; --fin-soft:#12343A; --chat:#A18CF2; --chat-soft:#272550;
    --ok:#4CC27F; --bad:#F07067; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#132238; --surface2:#182A44; --ink:#E7EEF7; --muted:#9AAAC0; --line:#24395A;
  --blue:#5B93F0; --blue-ink:#071224; --fin:#3BC2B0; --fin-soft:#12343A; --chat:#A18CF2; --chat-soft:#272550;
  --ok:#4CC27F; --bad:#F07067; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 64px}

/* Coin */
.coin{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;vertical-align:-.18em;
  background:radial-gradient(circle at 34% 28%,#FFF0B0 0,#F5C93B 38%,#E0A713 70%,#A87905 100%);
  box-shadow:inset 0 0 0 .07em #C38F0E,inset 0 0 0 .14em #F7D763;color:#6F4D00;font:800 .62em/1 "Bricolage Grotesque",sans-serif}
.coin.big{width:120px;height:120px;font-size:64px;box-shadow:inset 0 0 0 6px #C38F0E,inset 0 0 0 12px #F7D763,0 18px 30px -16px rgba(154,108,0,.8)}
@media (prefers-reduced-motion:no-preference){
  .coin.big.spin{animation:flip 1.1s cubic-bezier(.2,.7,.2,1) 1}
  @keyframes flip{0%{transform:rotateY(0) scale(.85)}70%{transform:rotateY(720deg) scale(1.04)}100%{transform:rotateY(720deg) scale(1)}}
}

/* Top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand .coin{font-size:30px}
.role{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
nav.tabs:empty{display:none}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--blue);color:var(--blue-ink)}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 26px;margin-bottom:26px;box-shadow:var(--shadow);perspective:600px}
.hero .amount{font:800 clamp(48px,9vw,84px)/.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.hero .label{color:var(--muted);margin-top:6px}
.sector-tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.sector-tag.fin{background:var(--fin-soft);color:var(--fin)}
.sector-tag.chat{background:var(--chat-soft);color:var(--chat)}
.sector-tag.ambos{background:var(--surface2);color:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:left}.coin.big{width:84px;height:84px;font-size:44px}}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.section-head h2{font-size:24px;font-weight:700}
.hint{color:var(--muted);font-size:14px}

/* Ticket cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ticket{--notch:calc(100% - 66px);position:relative;background:var(--surface);border-radius:16px;display:flex;flex-direction:column;min-height:220px;filter:drop-shadow(0 6px 10px rgba(16,35,58,.10));
  -webkit-mask:radial-gradient(circle 10px at 0 var(--notch),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--notch),#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 10px at 0 var(--notch),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--notch),#0000 97%,#000) right/51% 100% no-repeat}
.ticket .body{padding:18px 18px 12px;flex:1}
.ticket .emoji{font-size:34px;line-height:1}
.ticket h3{font-size:19px;font-weight:700;margin:10px 0 4px}
.ticket p{margin:0;color:var(--muted);font-size:14px}
.ticket .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.ticket .stub{height:66px;border-top:2px dashed var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 18px;gap:10px}
.price{font:800 24px/1 "Bricolage Grotesque",sans-serif;display:flex;align-items:center;gap:6px}
.ticket.off{opacity:.55}

.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
.btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.warn{background:var(--gold);color:#3E2C00}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:none;color:var(--bad);border:1px solid currentColor}
.btn.sm{padding:6px 10px;font-size:14px}

/* Panels & lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel h3{font-size:18px;margin-bottom:12px}
.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{flex:1 1 120px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600}
.list .s{color:var(--muted);font-size:13px}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--bad);font-weight:700}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status.pendente{background:#FFF1C9;color:#7A5600}
.status.entregue{background:#D7F1E2;color:#145C34}
.status.recusada{background:#F9DEDB;color:#8A231D}
.status.aprovada{background:#D7F1E2;color:#145C34}
.reward{font:800 22px/1 "Bricolage Grotesque",sans-serif;display:flex;align-items:center;gap:6px;color:var(--ok)}
.tform{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.proof{width:72px;height:52px;border-radius:8px;object-fit:cover;cursor:zoom-in;border:1px solid var(--line);flex:none;padding:0;background:none}
.proof img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
.subitem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.subitem:last-child{border-bottom:0}
.subitem .note{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.lb{position:fixed;inset:0;background:rgba(5,12,22,.82);display:grid;place-items:center;z-index:20;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:90vh;border-radius:12px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.subnav button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.count{background:var(--gold);color:#3E2C00;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
.empty{color:var(--muted);padding:22px 4px;text-align:center}
.rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);flex:none}
.pos.p1{background:var(--gold);color:#3E2C00}
.slot{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:10px}
.slot b{font-family:"Bricolage Grotesque",sans-serif}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;max-width:560px;margin:40px auto}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.choose button{border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:22px 12px;cursor:pointer;font:700 18px "Bricolage Grotesque",sans-serif}
.choose button.fin:hover,.choose button.fin:focus-visible{border-color:var(--fin)}
.choose button.chat:hover,.choose button.chat:focus-visible{border-color:var(--chat)}
@media (max-width:480px){.choose{grid-template-columns:1fr}}
.joinform{text-align:left;margin-top:18px}
.choose button[aria-pressed="true"].fin{border-color:var(--fin);background:var(--fin-soft);color:var(--fin)}
.choose button[aria-pressed="true"].chat{border-color:var(--chat);background:var(--chat-soft);color:var(--chat)}
.ticket .pic{aspect-ratio:16/10;background:var(--surface2);overflow:hidden}
.ticket .pic img{width:100%;height:100%;object-fit:cover;display:block}
.imgpick{display:flex;gap:12px;align-items:center}
.thumb{width:96px;height:60px;border-radius:10px;border:1px dashed var(--line);background:var(--surface2);display:grid;place-items:center;font-size:12px;color:var(--muted);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.mini{width:48px;height:32px;border-radius:6px;object-fit:cover;flex:none}
.auth{max-width:420px;margin:28px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.auth h2{font-size:26px;margin:16px 0 6px}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.setup{background:#FFF1C9;color:#5A4000;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.setup code{background:rgba(0,0,0,.08);padding:2px 6px;border-radius:6px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:10;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.check{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.mural{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:14px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.mural b{font-family:"Bricolage Grotesque",sans-serif;font-size:15px}
.mural p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.previewbar{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.previewbar span{flex:1 1 220px;font-weight:600}
.previewbar .btn{background:var(--bg);color:var(--ink)}
.previewbar .btn[aria-current="true"]{background:var(--gold);color:#3E2C00}
.sector-tag.new{background:var(--gold);color:#3E2C00}
.sector-tag.late{background:#F9DEDB;color:#8A231D}
.status.separacao{background:#DDE8FB;color:#1B4FA8}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface2);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font:800 30px/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13px}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
.prog div{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:14px}
.podium{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.podium span{background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:13px}
.tag-role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px}
.tag-role.blocked{background:#F9DEDB;color:#8A231D}
.in.sm{padding:6px 9px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="coin" aria-hidden="true">U</span><h1>Unicoins</h1></div>
    <span class="role" id="role">Carregando…</span>
    <button class="btn ghost sm" id="viewBtn" hidden>Prévia do colaborador</button>
    <button class="btn ghost sm" id="logout" hidden>Sair</button>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  </header>
  <div id="setupBanner"></div>
  <main id="main"><p class="hint">Abrindo o balcão de prêmios…</p></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO — dados do projeto Firebase
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCLGvBZgq0BwY_Ph7UtXT5EVqUicphZPfI",
  authDomain: "premios-82561.firebaseapp.com",
  projectId: "premios-82561",
  storageBucket: "premios-82561.firebasestorage.app",
  messagingSenderId: "873110414678",
  appId: "1:873110414678:web:442fdd7d76b201c62ce2f7",
  measurementId: "G-P1980MEB5T"
};
/* UID da conta do administrador (o mesmo do arquivo firestore.rules) */
const ADMIN_UIDS = ["BqiKenEb0RO75NZqJLmwyJ1yOwh1"];
/* Opcional: limitar cadastro a e-mails corporativos. Ex.: ["uniasselvi.com.br"]. Vazio = qualquer e-mail. */
const ALLOWED_EMAIL_DOMAINS = [];
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, query, where, orderBy, limit, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, runTransaction, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const SECT = { fin:{ name:'Financeiro' }, chat:{ name:'Chat Uniasselvi' }, ambos:{ name:'Ambos os setores' } };
const RED_LAB = { pendente:'Aguardando', separacao:'Em separação', entregue:'Entregue', recusada:'Recusada · estornado' };
const SUB_LAB = { pendente:'Em análise', aprovada:'Aprovada', recusada:'Recusada' };

const S = {};
function resetState(){
  Object.assign(S, {
    me:null, email:'', owner:false, mine:null, gotCfg:false, gotMine:false,
    cfg:{ supervisors:[null,null], seasonKey:'', seasonName:'', seasonStart:0 }, notice:null, seasons:[],
    players:{}, items:[], tasks:[], tasksSec:[], tasksMine:[], reds:[], redsOpen:[], redsRecent:[], ledger:[],
    subs:[], subsPend:[], subsRecent:[], audit:[], proofs:{}, proofLoading:new Set(),
    tab:'loja', sub:'tarefas', viewAs:null, preview:null,
    editing:null, formImg:null, editingTask:null, tMode:'setor', tSel:new Set(), tFind:'',
    openTask:null, draft:{ note:'', image:null }, reasons:{}, obs:{}, names:{}, muralDraft:null,
    confirmId:null, confirmDel:null, confirmTDel:null, confirmRp:null, confirmBlock:null,
    progressTask:null, progressSubs:[], kpi:null, kpiLoading:false, pFind:'',
    newItems:new Set(), newTasks:new Set(), busy:false, loaded:false, emailFixing:false, joinSector:null
  });
}
resetState();

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
const when = t => t ? new Date(t).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
const dateBR = t => t ? new Date(t).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '';
const coin = '<span class="coin" aria-hidden="true">U</span>';
const now = () => Date.now();
const isSup = () => S.owner || (!!S.me && S.cfg.supervisors.includes(S.me));
const me = () => S.mine;
const isBlocked = () => !!(S.mine && S.mine.blocked) && !isSup();
const canAct = () => !S.viewAs && !!me() && !me().blocked;
const nm = id => (S.players[id] && S.players[id].name) || (ADMIN_UIDS.includes(id) ? 'Administrador' : id === S.me ? 'Você' : 'Colaborador');
const safeImg = v => typeof v === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : null;
const bal = id => Number((S.players[id] && S.players[id].balance) || 0);
const earned = id => Number((S.players[id] && S.players[id].earned) || 0);
const isEarnKind = k => k === 'credit' || k === 'bulk' || k === 'task';
const byAtDesc = (a, b) => (b.at || 0) - (a.at || 0);
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600); }
function viewSector(){
  if (S.viewAs) return S.viewAs;
  if (isSup()) return S.preview || (me() && me().sector) || 'fin';
  return me() ? me().sector : 'fin';
}
const seasonLabel = () => S.cfg.seasonName || 'Temporada atual';

/* ---------- Novidades (marcador "Nova") ---------- */
const seenKey = () => 'unicoins_seen_' + S.me;
function getSeen(){ try { const v = JSON.parse(localStorage.getItem(seenKey()) || 'null'); if (v) return v; } catch(e){} const v = { items:now(), tasks:now() }; try { localStorage.setItem(seenKey(), JSON.stringify(v)); } catch(e){} return v; }
function setSeen(kind){ const v = getSeen(); v[kind] = now(); try { localStorage.setItem(seenKey(), JSON.stringify(v)); } catch(e){} }

/* ---------- Firebase ---------- */
const configured = !String(FIREBASE_CONFIG.apiKey).startsWith('COLE');
let fdb = null, auth = null;
let base = [], live = [], liveKey = '', progUnsub = null;
function stopAll(){ base.forEach(u => u()); live.forEach(u => u()); if (progUnsub) progUnsub(); base = []; live = []; liveKey = ''; progUnsub = null; }

if (!configured) {
  notice('Falta configurar o Firebase. Preencha FIREBASE_CONFIG no início do arquivo index.html.');
} else {
  const app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app); fdb = getFirestore(app);
  onAuthStateChanged(auth, u => {
    stopAll(); resetState();
    $('#logout').hidden = !u; $('#viewBtn').hidden = true;
    if (!u) return showLogin();
    if (ALLOWED_EMAIL_DOMAINS.length && !ALLOWED_EMAIL_DOMAINS.some(d => (u.email || '').toLowerCase().endsWith('@' + d.toLowerCase()))) {
      signOut(auth); return showLogin('Use seu e-mail corporativo (' + ALLOWED_EMAIL_DOMAINS.map(d => '@' + d).join(', ') + ').');
    }
    S.me = u.uid; S.owner = ADMIN_UIDS.includes(u.uid); S.email = u.email || '';
    setupBanner();
    $('#role').textContent = 'Carregando…'; $('#main').innerHTML = '<p class="hint">Abrindo o balcão de prêmios…</p>';
    base.push(onSnapshot(doc(fdb, 'config', 'main'), s => {
      const d = s.exists() ? s.data() : {};
      const raw = Array.isArray(d.supervisors) ? d.supervisors : [];
      const sv = raw.filter(Boolean).slice(0, 2); while (sv.length < 2) sv.push(null);
      S.cfg = { supervisors:sv, seasonKey:d.seasonKey || '', seasonName:d.seasonName || '', seasonStart:d.seasonStart || 0 };
      if (S.owner && (!d.seasonKey || raw.length !== 2 || raw.some((x, i) => x !== sv[i]))) {
        setDoc(doc(fdb, 'config', 'main'), { supervisors:sv, seasonKey:d.seasonKey || 'S1', seasonName:d.seasonName || 'Temporada 1', seasonStart:d.seasonStart || now() }).catch(e => console.error(e));
      }
      S.gotCfg = true; resub(); changed();
    }, onErr));
    base.push(onSnapshot(doc(fdb, 'config', 'notice'), s => { S.notice = s.exists() ? s.data() : null; changed(); }, e => console.error(e)));
    base.push(onSnapshot(query(collection(fdb, 'seasons'), orderBy('endedAt', 'desc'), limit(12)), q => { S.seasons = q.docs.map(d => ({ id:d.id, ...d.data() })); changed(); }, e => console.error(e)));
    base.push(onSnapshot(doc(fdb, 'players', S.me), s => {
      S.mine = s.exists() ? { id:s.id, ...s.data() } : null;
      if (S.mine) {
        S.players[S.me] = S.mine;
        if (S.email && S.mine.email !== S.email && !S.emailFixing) { S.emailFixing = true; updateDoc(doc(fdb, 'players', S.me), { email:S.email }).catch(() => {}).finally(() => S.emailFixing = false); }
      }
      S.gotMine = true; resub(); changed();
    }, onErr));
  });
}

function onErr(e){
  console.error(e);
  if (e && e.code === 'permission-denied') notice('O banco recusou o acesso. Confira se as regras do arquivo firestore.rules foram publicadas no Firebase e se o seu UID está nelas.');
  else toast('Falha de conexão com o banco. Verifique a internet e recarregue a página.');
}

const list = (q, fn) => live.push(onSnapshot(q, snap => { fn(snap.docs.map(d => ({ id:d.id, ...d.data() }))); changed(); }, onErr));
function mergeSubs(){ const m = new Map(); [...S.subsPend, ...S.subsRecent].forEach(x => m.set(x.id, x)); S.subs = [...m.values()].sort(byAtDesc); }
function mergeReds(){ const m = new Map(); [...S.redsOpen, ...S.redsRecent].forEach(x => m.set(x.id, x)); S.reds = [...m.values()].sort(byAtDesc); }
function mergeTasks(){ const m = new Map(); [...S.tasksSec, ...S.tasksMine].forEach(t => m.set(t.id, t)); S.tasks = [...m.values()]; }

function resub(){
  if (!S.gotCfg || !S.gotMine) return;
  const key = [isSup() ? 'sup' : 'col', S.mine ? S.mine.sector : '-', isBlocked() ? 'b' : '', S.owner ? 'o' : ''].join('|');
  if (key === liveKey) return;
  live.forEach(u => u()); live = []; liveKey = key; closeProgress();
  Object.assign(S, { players:S.mine ? { [S.me]:S.mine } : {}, items:[], tasks:[], tasksSec:[], tasksMine:[], reds:[], redsOpen:[], redsRecent:[], ledger:[], subs:[], subsPend:[], subsRecent:[], audit:[] });
  const C = n => collection(fdb, n);
  if (isSup()) {
    list(C('players'), a => { const o = {}; a.forEach(p => o[p.id] = p); S.players = o; });
    list(C('items'), a => S.items = a);
    list(C('tasks'), a => { S.tasks = a; migrateTasks(); });
    list(query(C('redemptions'), where('status', 'in', ['pendente', 'separacao'])), a => { S.redsOpen = a; mergeReds(); });
    list(query(C('redemptions'), orderBy('at', 'desc'), limit(150)), a => { S.redsRecent = a; mergeReds(); });
    list(query(C('ledger'), orderBy('at', 'desc'), limit(150)), a => S.ledger = a);
    list(query(C('submissions'), where('status', '==', 'pendente')), a => { S.subsPend = a; mergeSubs(); });
    list(query(C('submissions'), orderBy('at', 'desc'), limit(60)), a => { S.subsRecent = a; mergeSubs(); });
    if (S.owner) list(query(C('audit'), orderBy('at', 'desc'), limit(150)), a => S.audit = a);
  } else if (S.mine && !isBlocked()) {
    const sec = S.mine.sector;
    list(query(C('players'), where('sector', '==', sec)), a => { const o = {}; a.forEach(p => o[p.id] = p); o[S.me] = S.mine; S.players = o; });
    list(query(C('items'), where('sector', 'in', ['ambos', sec])), a => S.items = a);
    list(query(C('tasks'), where('audience', 'array-contains', 'sec:' + sec)), a => { S.tasksSec = a; mergeTasks(); });
    list(query(C('tasks'), where('audience', 'array-contains', 'uid:' + S.me)), a => { S.tasksMine = a; mergeTasks(); });
    list(query(C('redemptions'), where('player', '==', S.me)), a => S.reds = a.sort(byAtDesc));
    list(query(C('ledger'), where('player', '==', S.me)), a => S.ledger = a.sort(byAtDesc));
    list(query(C('submissions'), where('player', '==', S.me)), a => { S.subsRecent = a; mergeSubs(); });
  }
  S.loaded = true; build();
}

let tasksMigrated = false;
function migrateTasks(){
  if (tasksMigrated || !isSup()) return; tasksMigrated = true;
  S.tasks.filter(t => !Array.isArray(t.audience)).forEach(t => updateDoc(doc(fdb, 'tasks', t.id), { audience:audOf(t) }).catch(() => { tasksMigrated = false; }));
}

/* ---------- Registro de ações da supervisão ---------- */
function audit(action, detail){
  if (!isSup() || !fdb) return;
  addDoc(collection(fdb, 'audit'), { by:S.me, byName:nm(S.me), action, detail:String(detail || '').slice(0, 300), at:now() }).catch(e => console.error(e));
}
function cfgWrite(patch){
  return setDoc(doc(fdb, 'config', 'main'), { supervisors:S.cfg.supervisors, seasonKey:S.cfg.seasonKey || 'S1', seasonName:S.cfg.seasonName || 'Temporada 1', seasonStart:S.cfg.seasonStart || now(), ...patch });
}

function notice(msg){ $('#role').textContent = 'Unicoins'; $('#tabs').innerHTML = ''; $('#main').innerHTML = `<div class="notice"><span class="coin big" aria-hidden="true">U</span><h2 style="margin-top:16px">${esc(msg)}</h2></div>`; }
function setupBanner(){

  b.innerHTML = ADMIN_UIDS.some(x => x.startsWith('COLE')) && S.me ? `<div class="setup"><b>Configuração inicial:</b> o UID desta conta é <code>${esc(S.me)}</code> <button class="btn ghost sm" id="copyUid">Copiar</button><br>Se esta é a conta do administrador, cole o UID em <code>ADMIN_UIDS</code> no index.html e no arquivo <code>firestore.rules</code>.</div>` : '';

/* ---------- Login ---------- */

/* ---------- Tarefas: público e prazo ---------- */
const audOf = t => Array.isArray(t.audience) ? t.audience : (t.sector === 'ambos' ? ['sec:fin', 'sec:chat'] : ['sec:' + t.sector]);
const isIndividual = t => audOf(t).some(a => a.startsWith('uid:'));
const isExpired = t => !!t.deadlineAt && now() > t.deadlineAt;
const supIds = () => S.cfg.supervisors.filter(Boolean);
function visibleFor(t, sector){
  const a = audOf(t);
  if (a.includes('sec:' + sector)) return true;
  if (S.viewAs) return false;
  const p = me();
  if (p && p.sector === sector && a.includes('uid:' + S.me)) return true;
  return isSup() && a.some(x => x.startsWith('uid:') && S.players[x.slice(4)] && S.players[x.slice(4)].sector === sector);
}
function audLabel(t){
  const a = audOf(t);
  if (!isIndividual(t)) return a.length > 1 ? 'Ambos os setores' : (SECT[a[0].slice(4)] || {}).name || '';
  const names = a.filter(x => x.startsWith('uid:')).map(x => nm(x.slice(4)));
  return names.length > 3 ? names.slice(0, 3).join(', ') + ' e mais ' + (names.length - 3) : names.join(', ');
}
function audiencePlayers(t){
  const a = audOf(t), sups = supIds();
  return Object.values(S.players).filter(p => !p.blocked && !ADMIN_UIDS.includes(p.id) && !sups.includes(p.id) && (a.includes('sec:' + p.sector) || a.includes('uid:' + p.id)))
    .sort((x, y) => nm(x.id).localeCompare(nm(y.id)));
}
const hasRedeemed = itemId => S.reds.some(r => r.item === itemId && r.player === S.me && r.season === S.cfg.seasonKey && r.status !== 'recusada');

/* ---------- Layout ---------- */
let lastShape = '';
const shape = () => [isSup(), !!me(), isBlocked(), S.tab, S.sub, S.viewAs].join('|');
function changed(){ if (!S.loaded) return; if (shape() !== lastShape) build(); else fill(); }

function tabsFor(){
  if (S.viewAs) return [['loja', 'Loja'], ['tarefas', 'Tarefas'], ['ranking', 'Ranking']];
  let t = [['loja', 'Loja'], ['tarefas', 'Tarefas'], ['meus', 'Meus resgates'], ['ranking', 'Ranking']];
  if (!me()) t = t.filter(x => x[0] !== 'meus');
  if (isSup()) t.push(['sup', 'Supervisão']);
  return t;
}
function newCount(kind){
  if (isSup() || !canAct()) return 0;
  const seen = getSeen()[kind];
  if (kind === 'items') return S.items.filter(i => i.active !== false && (i.createdAt || 0) > seen).length;
  return S.tasks.filter(t => t.active !== false && !isExpired(t) && (t.createdAt || 0) > seen).length;
}
function supCount(){ return S.redsOpen.filter(r => r.status === 'pendente').length + S.subsPend.length; }
function tabBadges(){
  const set = (k, n) => { const el = document.getElementById('badge-' + k); if (el) el.innerHTML = n ? ` <span class="count">${n}</span>` : ''; };
  set('loja', S.tab === 'loja' ? 0 : newCount('items')); set('tarefas', S.tab === 'tarefas' ? 0 : newCount('tasks')); set('sup', supCount());
}
function markSeen(kind){
  if (isSup() || !canAct()) { S[kind === 'items' ? 'newItems' : 'newTasks'] = new Set(); return; }
  const seen = getSeen()[kind], src = kind === 'items' ? S.items : S.tasks;
  S[kind === 'items' ? 'newItems' : 'newTasks'] = new Set(src.filter(x => (x.createdAt || 0) > seen).map(x => x.id));
  setSeen(kind);
}

function renderHeader(){
  const sup = isSup(), p = me();
  $('#role').textContent = S.viewAs ? 'Prévia · ' + SECT[S.viewAs].name : S.owner ? 'Administrador' : sup ? 'Supervisão' : p ? (p.name || 'Colaborador') + ' · ' + SECT[p.sector].name + (p.supRequest ? ' · supervisão aguardando liberação' : '') : 'Novo por aqui';
  $('#viewBtn').hidden = !sup || !!S.viewAs;
}
const previewBar = () => S.viewAs ? `<div class="previewbar"><span>Prévia: você está vendo o Unicoins como um colaborador do ${SECT[S.viewAs].name}. Trocas e envios ficam desativados.</span>
  ${['fin', 'chat'].map(k => `<button class="btn sm" data-viewas="${k}" aria-current="${S.viewAs === k}">${SECT[k].name}</button>`).join('')}<button class="btn sm" id="exitView">Sair da prévia</button></div>` : '';

function build(){
  lastShape = shape();
  const sup = isSup(), p = me();
  renderHeader();
  if (isBlocked()) { $('#tabs').innerHTML = ''; $('#main').innerHTML = `<div class="notice"><span class="coin big" aria-hidden="true">U</span><h2 style="margin-top:16px">Seu acesso ao Unicoins foi removido.</h2><p class="hint">Se achar que é um engano, fale com a supervisão.</p></div>`; return; }
  if (!sup && !p) {
    $('#tabs').innerHTML = '';
    $('#main').innerHTML = `<div class="notice"><span class="coin big spin" aria-hidden="true">U</span>
      <h2 style="margin-top:18px">Cadastre-se para entrar na loja</h2>
      <p class="hint">Seus Unicoins e os prêmios disponíveis dependem do setor. Só a supervisão pode mudar o setor depois.</p>
      <form id="joinForm" class="joinform" autocomplete="off">
        <label class="f" for="jName">Seu nome</label><input class="in" id="jName" required maxlength="60" placeholder="Nome e sobrenome">
        <span class="f" style="margin-top:14px">Seu setor</span>
        <div class="choose" style="margin-top:6px"><button type="button" class="fin" data-pick="fin" aria-pressed="${S.joinSector === 'fin'}">Financeiro</button><button type="button" class="chat" data-pick="chat" aria-pressed="${S.joinSector === 'chat'}">Chat Uniasselvi</button></div>
        <label class="check"><input type="checkbox" id="jSup"> Faço parte da supervisão (o administrador precisa liberar)</label>
        <button class="btn" type="submit" style="margin-top:18px;width:100%">Entrar na loja</button>
      </form></div>`;
    return;
  }
  const tabs = tabsFor();
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" aria-current="${S.tab === k}">${l}<span id="badge-${k}"></span></button>`).join('');
  const M = $('#main'), pre = previewBar();
  if (S.tab === 'loja') { markSeen('items'); M.innerHTML = pre + `<div id="mural"></div><div id="hero"></div>
    <div class="section-head"><h2>Prêmios</h2><span class="hint" id="storeHint"></span></div><div id="previewNav"></div><div class="grid" id="store"></div>`; }
  if (S.tab === 'tarefas') { markSeen('tasks'); M.innerHTML = pre + `<div id="mural"></div><div class="section-head"><h2>Tarefas</h2><span class="hint">Conclua e ganhe Unicoins. A supervisão confere antes de creditar.</span></div>
    <div id="taskPrev"></div><div class="grid" id="tasks"></div>
    ${canAct() ? `<section class="panel" style="margin-top:24px"><h3>Minhas entregas</h3><ul class="list" id="mySubs"></ul></section>` : ''}`; }
  if (S.tab === 'meus') M.innerHTML = `<div class="cols"><section class="panel"><h3>Extrato</h3><ul class="list" id="myLedger"></ul></section>
    <section class="panel"><h3>Meus resgates</h3><ul class="list" id="myReds"></ul></section></div>`;
  if (S.tab === 'ranking') M.innerHTML = pre + `<div class="section-head"><h2 id="rankTitle"></h2><span class="hint">Moedas ganhas na temporada, sem descontar as trocas.</span></div><div class="rank" id="rank"></div>
    <div class="section-head" style="margin-top:30px"><h2>Temporadas anteriores</h2></div><div id="seasonsBox"></div>`;
  if (S.tab === 'sup') buildSup();
  fill();
}

function fill(){
  if (isBlocked() || (!isSup() && !me())) return;
  renderHeader(); tabBadges();
  const mural = $('#mural');
  if (mural) mural.innerHTML = S.notice && S.notice.text ? `<div class="mural"><b>📌 Recado da supervisão</b><p>${esc(S.notice.text)}</p></div>` : '';
  if (S.tab === 'loja') fillStore();
  if (S.tab === 'tarefas') keepFocus(fillTasks);
  if (S.tab === 'meus') fillMine();
  if (S.tab === 'ranking') fillRank();
  if (S.tab === 'sup') keepFocus(fillSup);
}
function keepFocus(fn){
  const a = document.activeElement, id = a && a.id, st = a && a.selectionStart, en = a && a.selectionEnd;
  fn();
  if (id && document.activeElement !== a) { const n = document.getElementById(id); if (n) { n.focus(); try { if (st != null) n.setSelectionRange(st, en); } catch(e){} } }
}

/* ---------- Loja ---------- */
function fillStore(){
  const p = me(), sup = isSup(), sector = viewSector();
  const act = canAct() && p.sector === sector;
  $('#hero').innerHTML = p && !S.viewAs ? `<div class="hero"><span class="coin big ${S.spun ? '' : 'spin'}" aria-hidden="true">U</span><div>
    <div class="amount">${fmt(bal(S.me))}</div><div class="label">Unicoins para trocar · <span class="sector-tag ${p.sector}">${SECT[p.sector].name}</span> · ${esc(seasonLabel())}</div></div></div>` : '';
  if (p && !S.viewAs) S.spun = true;
  $('#previewNav').innerHTML = sup && !S.viewAs ? `<div class="subnav">${['fin', 'chat'].map(k => `<button data-prev="${k}" aria-current="${sector === k}">Loja ${SECT[k].name}</button>`).join('')}</div>` : '';
  const items = S.items.filter(i => i.active !== false && (i.sector === 'ambos' || i.sector === sector)).sort((a, b) => a.cost - b.cost);
  $('#storeHint').textContent = `${items.length} ${items.length === 1 ? 'prêmio' : 'prêmios'} · cada prêmio pode ser resgatado 1 vez por pessoa na temporada`;
  if (!items.length) { $('#store').innerHTML = `<p class="empty" style="grid-column:1/-1">${sup && !S.viewAs ? 'Nenhum prêmio para este setor. Adicione em Supervisão › Prêmios.' : 'A loja ainda está vazia. Os prêmios aparecem aqui assim que a supervisão cadastrar.'}</p>`; return; }
  $('#store').innerHTML = items.map(i => {
    const out = i.stock !== null && i.stock !== undefined && i.stock <= 0;
    const done = act && hasRedeemed(i.id);
    const short = act ? i.cost - bal(S.me) : 0;
    let btn = '';
    if (S.viewAs) btn = `<button class="btn" disabled>${out ? 'Esgotado' : 'Trocar'}</button>`;
    else if (act) {
      if (done) btn = `<button class="btn" disabled>Já resgatado</button>`;
      else if (out) btn = `<button class="btn" disabled>Esgotado</button>`;
      else if (short > 0) btn = `<button class="btn" disabled>Faltam ${fmt(short)}</button>`;
      else if (S.confirmId === i.id) btn = `<button class="btn warn" data-buy="${i.id}" data-confirm="1">Confirmar troca</button>`;
      else btn = `<button class="btn" data-buy="${i.id}">Trocar</button>`;
    } else if (out) btn = `<span class="hint">Esgotado</span>`;
    const stock = i.stock === null || i.stock === undefined ? 'Estoque livre' : out ? 'Sem estoque' : `${fmt(i.stock)} restantes`;
    const img = safeImg(i.image);
    return `<article class="ticket ${out || done ? 'off' : ''}">${img ? `<div class="pic"><img src="${img}" alt=""></div>` : ''}<div class="body">${img ? '' : `<div class="emoji" aria-hidden="true">${esc(i.emoji || '🎁')}</div>`}
      <h3>${esc(i.name)}</h3>${i.desc ? `<p>${esc(i.desc)}</p>` : ''}
      <div class="meta">${S.newItems.has(i.id) ? '<span class="sector-tag new">Nova</span>' : ''}<span class="sector-tag ${i.sector}">${(SECT[i.sector] || {}).name || ''}</span><span class="sector-tag ambos">${stock}</span></div></div>
      <div class="stub"><span class="price">${coin}${fmt(i.cost)}</span>${btn}</div></article>`;
  }).join('');
}

/* ---------- Tarefas (visão do colaborador) ---------- */
function fillTasks(){
  const p = me(), sup = isSup(), sector = viewSector();
  const act = canAct() && p.sector === sector;
  $('#taskPrev').innerHTML = sup && !S.viewAs ? `<div class="subnav">${['fin', 'chat'].map(k => `<button data-prev="${k}" aria-current="${sector === k}">Tarefas ${SECT[k].name}</button>`).join('')}</div>` : '';
  const mineOf = t => S.subs.filter(x => x.task === t.id && x.player === S.me);
  let list = S.tasks.filter(t => t.active !== false && visibleFor(t, sector));
  if (!sup || S.viewAs) list = list.filter(t => !isExpired(t) || (act && mineOf(t).some(x => x.status !== 'recusada')));
  list.sort((a, b) => (isExpired(a) - isExpired(b)) || ((a.deadlineAt || 9e15) - (b.deadlineAt || 9e15)) || ((b.createdAt || 0) - (a.createdAt || 0)));
  const box = $('#tasks');
  if (!list.length) box.innerHTML = `<p class="empty" style="grid-column:1/-1">${sup && !S.viewAs ? 'Nenhuma tarefa para este setor. Crie em Supervisão › Tarefas.' : 'Nenhuma tarefa aberta agora. Novas tarefas aparecem aqui assim que a supervisão publicar.'}</p>`;
  else box.innerHTML = list.map(t => {
    const mine = act ? mineOf(t) : [];
    const pend = mine.some(x => x.status === 'pendente'), done = mine.some(x => x.status === 'aprovada');
    const exp = isExpired(t);
    let action = '';
    if (S.viewAs) action = `<button class="btn" disabled>${t.proof ? 'Enviar comprovação' : 'Marcar como feita'}</button>`;
    else if (act) {
      if (pend) action = `<span class="status pendente">Em análise</span>`;
      else if (done && !t.repeat) action = `<span class="status aprovada">Concluída</span>`;
      else if (exp) action = `<span class="status recusada">Prazo encerrado</span>`;
      else if (S.openTask !== t.id) action = `<button class="btn" data-open="${t.id}">${t.proof ? 'Enviar comprovação' : 'Marcar como feita'}</button>`;
    } else if (sup) { const aud = audiencePlayers(t), ok = new Set(S.subs.filter(x => x.task === t.id && x.status === 'aprovada').map(x => x.player)); action = `<span class="hint">${aud.filter(p => ok.has(p.id)).length}/${aud.length} concluíram</span>`; }
    const form = act && S.openTask === t.id && !exp ? `<form class="tform" id="subForm" data-task="${t.id}">
        <label class="f" for="sNote" style="margin-top:0">${t.proof ? 'Comprovação: link ou descrição' : 'Observação (opcional)'}</label>
        <textarea class="in" id="sNote" rows="2" maxlength="500">${esc(S.draft.note)}</textarea>
        ${t.proof ? `<span class="f">Imagem (print, foto)</span><div class="imgpick"><div class="thumb">${safeImg(S.draft.image) ? `<img src="${S.draft.image}" alt="Comprovação">` : 'Sem imagem'}</div>
          <div class="row" style="gap:6px"><input type="file" id="sImg" accept="image/png,image/jpeg,image/webp,image/gif" class="sr"><label for="sImg" class="btn ghost sm" style="flex:none" tabindex="0" id="sImgBtn">Anexar imagem</label>
          ${S.draft.image ? '<button type="button" class="btn bad sm" style="flex:none" id="sImgDel">Remover</button>' : ''}</div></div>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn" type="submit">Enviar para a supervisão</button><button class="btn ghost" type="button" id="sCancel">Cancelar</button></div></form>` : '';
    const dl = t.deadlineAt ? `<span class="sector-tag ${exp ? 'late' : 'ambos'}">${exp ? 'Encerrada em ' : 'Até '}${dateBR(t.deadlineAt)}</span>` : '';
    return `<article class="ticket ${exp ? 'off' : ''}"><div class="body"><div class="meta" style="margin-top:0">
      ${S.newTasks.has(t.id) ? '<span class="sector-tag new">Nova</span>' : ''}${isIndividual(t) ? '<span class="sector-tag ambos">Individual</span>' : `<span class="sector-tag ${t.sector}">${(SECT[t.sector] || {}).name || ''}</span>`}
      ${dl}${t.proof ? '<span class="sector-tag ambos">Exige comprovação</span>' : ''}${t.repeat ? '<span class="sector-tag ambos">Repetível</span>' : ''}</div>
      <h3>${esc(t.title)}</h3>${t.desc ? `<p style="white-space:pre-wrap">${esc(t.desc)}</p>` : ''}${sup && !S.viewAs && isIndividual(t) ? `<p class="hint" style="font-size:13px;margin-top:6px">Para: ${esc(audLabel(t))}</p>` : ''}${form}</div>
      <div class="stub"><span class="reward">+${fmt(t.reward)} ${coin}</span>${action}</div></article>`;
  }).join('');
  const ms = $('#mySubs');
  if (ms) { const L = S.subs.filter(x => x.player === S.me);
    ms.innerHTML = L.length ? L.map(x => `<li><div class="grow"><div class="t">${esc(x.taskTitle)}</div><div class="s">${when(x.at)}${x.status === 'recusada' && x.reason ? ' · Motivo: ' + esc(x.reason) : ''}</div></div>
      <span class="reward" style="font-size:16px;${x.status === 'aprovada' ? '' : 'color:var(--muted)'}">+${fmt(x.reward)}</span><span class="status ${x.status}">${SUB_LAB[x.status]}</span></li>`).join('') : '<li class="empty">Você ainda não enviou nenhuma tarefa.</li>'; }
}

/* ---------- Meus resgates ---------- */
function ledgerLi(l, showWho){
  const pos = l.amount >= 0;
  return `<li><div class="grow"><div class="t">${esc(l.reason || '')}</div><div class="s">${showWho ? esc(nm(l.player)) + ' · ' : ''}${when(l.at)}</div></div>
    <span class="${pos ? 'plus' : 'minus'}">${pos ? '+' : ''}${fmt(l.amount)}</span></li>`;
}
function fillMine(){
  const L = S.ledger.filter(l => l.player === S.me), R = S.reds.filter(r => r.player === S.me);
  $('#myLedger').innerHTML = L.length ? L.map(l => ledgerLi(l, false)).join('') : '<li class="empty">Nenhuma movimentação ainda.</li>';
  $('#myReds').innerHTML = R.length ? R.map(r => `<li><span style="font-size:24px" aria-hidden="true">${esc(r.emoji || '🎁')}</span><div class="grow"><div class="t">${esc(r.itemName)}</div>
    <div class="s">${fmt(r.cost)} Unicoins · ${when(r.at)}${r.obs ? ' · ' + esc(r.obs) : ''}</div></div><span class="status ${r.status}">${RED_LAB[r.status] || r.status}</span></li>`).join('') : '<li class="empty">Você ainda não trocou nenhum prêmio.</li>';
}

/* ---------- Ranking ---------- */
function fillRank(){
  const secs = isSup() && !S.viewAs ? ['fin', 'chat'] : [viewSector()];
  $('#rankTitle').textContent = 'Ranking · ' + seasonLabel();
  $('#rank').innerHTML = secs.map(k => {
    const ps = Object.values(S.players).filter(p => p.sector === k && !p.blocked && earned(p.id) > 0).sort((a, b) => earned(b.id) - earned(a.id)).slice(0, 10);
    return `<section class="panel"><h3><span class="sector-tag ${k}">${SECT[k].name}</span></h3><ul class="list">${ps.length ? ps.map((p, i) => `<li><span class="pos ${i === 0 ? 'p1' : ''}">${i + 1}</span><div class="grow t">${esc(nm(p.id))}</div><span class="price" style="font-size:18px">${coin}${fmt(earned(p.id))}</span></li>`).join('') : '<li class="empty">Ninguém pontuou ainda neste setor.</li>'}</ul></section>`;
  }).join('');
  $('#seasonsBox').innerHTML = S.seasons.length ? `<div class="rank">${S.seasons.map(se => `<section class="panel"><h3>${esc(se.name)}</h3><p class="hint" style="margin:-6px 0 8px;font-size:13px">${dateBR(se.startedAt)} a ${dateBR(se.endedAt)}</p>
    ${secs.map(k => { const top = ((se.ranking || {})[k] || []).slice(0, 3); return `<div style="margin-top:8px"><span class="sector-tag ${k}">${SECT[k].name}</span><div class="podium">${top.length ? top.map((r, i) => `<span>${['🥇', '🥈', '🥉'][i]} ${esc(r.name)} · ${fmt(r.earned)}</span>`).join('') : '<span>Sem pontuação</span>'}</div></div>`; }).join('')}</section>`).join('')}</div>`
    : '<p class="empty">Quando a supervisão encerrar uma temporada, o pódio fica guardado aqui.</p>';
}

function fillSup(){
  const sc = (k, n) => { const el = document.getElementById('sc-' + k); if (el) el.innerHTML = n ? ` <span class="count">${n}</span>` : ''; };
  sc('tarefas', S.subsPend.length); sc('pedidos', S.redsOpen.filter(r => r.status === 'pendente').length);
  sc('acessos', S.owner ? Object.values(S.players).filter(p => p.supRequest && !p.blocked && !supIds().includes(p.id)).length : 0);
  if (S.sub === 'tarefas') fillSupTasks();
  if (S.sub === 'premios') fillSupItems();
  if (S.sub === 'moedas') fillSupCoins();
  if (S.sub === 'pedidos') fillSupOrders();
  if (S.sub === 'painel') { renderKpis(); fillAudit(); }
  if (S.sub === 'mural') { const i = $('#muralInfo'); if (i) i.textContent = S.notice && S.notice.text ? `Publicado por ${nm(S.notice.by)} em ${when(S.notice.at)}.` : 'Nenhum recado publicado.'; }
  if (S.sub === 'colab') fillColab();
  if (S.sub === 'acessos') fillAccess();
}

/* Tarefas */
function fillPeoplePick(){
  const box = $('#tPeople'); if (!box) return;
  const sups = supIds(), q = S.tFind.toLowerCase();
  const ps = Object.values(S.players).filter(p => !p.blocked && !sups.includes(p.id) && !ADMIN_UIDS.includes(p.id) && nm(p.id).toLowerCase().includes(q)).sort((a, b) => nm(a.id).localeCompare(nm(b.id)));
  box.innerHTML = ps.length ? ['fin', 'chat'].map(k => { const g = ps.filter(p => p.sector === k); return g.length ? `<li style="border:0;padding:8px 2px 2px"><span class="sector-tag ${k}">${SECT[k].name}</span></li>` + g.map(p => `<li style="padding:6px 2px"><label class="check" style="margin:0;flex:1;cursor:pointer"><input type="checkbox" data-tsel="${p.id}" ${S.tSel.has(p.id) ? 'checked' : ''}> ${esc(nm(p.id))}</label></li>`).join('') : ''; }).join('')
    : '<li class="empty">Nenhum colaborador encontrado.</li>';
  selCount();
}
function selCount(){ const el = $('#tSelCount'); if (!el) return; const n = S.tSel.size; el.textContent = n ? `${n} ${n === 1 ? 'pessoa selecionada' : 'pessoas selecionadas'}` : 'Marque quem deve receber a tarefa.'; }
function proofOf(x){ return safeImg(x.image) || safeImg(S.proofs[x.id]); }
function loadProofs(list){
  list.filter(x => x.hasImage && !(x.id in S.proofs) && !S.proofLoading.has(x.id)).forEach(x => {
    S.proofLoading.add(x.id);
    getDoc(doc(fdb, 'proofs', x.id)).then(s => { S.proofs[x.id] = s.exists() ? s.data().image : null; S.proofLoading.delete(x.id); if (S.tab === 'sup' && S.sub === 'tarefas') keepFocus(fillSupTasks); }).catch(() => S.proofLoading.delete(x.id));
  });
}
function subBlock(x, pending){
  const img = proofOf(x);
  return `<div class="subitem">${img ? `<button class="proof" data-zoom="${x.id}" aria-label="Ampliar comprovação"><img src="${img}" alt=""></button>` : x.hasImage ? '<span class="proof" style="display:grid;place-items:center;font-size:11px;color:var(--muted)">carregando</span>' : '<span class="pos" aria-hidden="true">✓</span>'}
    <div><div class="t" style="font-weight:600">${esc(nm(x.player))} · ${esc(x.taskTitle)}</div>
    <div class="s hint" style="font-size:13px">${(SECT[x.sector] || {}).name || ''} · +${fmt(x.reward)} Unicoins · ${when(x.at)}</div>
    ${x.note ? `<div class="note">${esc(x.note)}</div>` : ''}
    ${pending ? `<div class="row" style="margin-top:10px"><input class="in" id="r_${x.id}" data-reason="${x.id}" placeholder="Motivo, se recusar" value="${esc(S.reasons[x.id] || '')}" style="flex:2 1 160px">
      <button class="btn ok sm" style="flex:none" data-approve="${x.id}">Aprovar</button><button class="btn bad sm" style="flex:none" data-reject="${x.id}">Recusar</button></div>`
      : `<div style="margin-top:6px"><span class="status ${x.status}">${SUB_LAB[x.status]}</span>${x.reason ? ` <span class="hint" style="font-size:13px">${esc(x.reason)}</span>` : ''}</div>`}</div></div>`;
}
function fillSupTasks(){
  fillPeoplePick();
  const ts = [...S.tasks].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $('#taskList').innerHTML = ts.length ? ts.map(t => `<li><div class="grow"><div class="t">${esc(t.title)}${t.active === false ? ' <span class="hint">(oculta)</span>' : ''}${isExpired(t) ? ' <span class="hint">(prazo encerrado)</span>' : ''}</div>

async function loadKpis(){
  if (S.kpiLoading) return; S.kpiLoading = true; S.kpi = null; renderKpis();
  try {
    const [rs, ss] = await Promise.all([getDocs(collection(fdb, 'redemptions')), getDocs(collection(fdb, 'submissions'))]);
    const reds = rs.docs.map(d => d.data()).filter(r => r.season === S.cfg.seasonKey);
    const subs = ss.docs.map(d => d.data()).filter(x => (x.at || 0) >= (S.cfg.seasonStart || 0));
    const ps = activePlayers().filter(p => !supIds().includes(p.id) && !ADMIN_UIDS.includes(p.id));
    const ok = subs.filter(x => x.status === 'aprovada'), no = subs.filter(x => x.status === 'recusada');
    const top = (arr, key) => { const m = {}; arr.forEach(x => m[x[key]] = (m[x[key]] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 5); };
    S.kpi = {
      people:ps.length, fin:ps.filter(p => p.sector === 'fin').length, chat:ps.filter(p => p.sector === 'chat').length,
      circ:ps.reduce((s, p) => s + bal(p.id), 0), dist:ps.reduce((s, p) => s + earned(p.id), 0),
      ok:ok.length, no:no.length, pend:subs.filter(x => x.status === 'pendente').length,
      rate:ok.length + no.length ? Math.round(100 * ok.length / (ok.length + no.length)) : null,
      trocas:reds.filter(r => r.status !== 'recusada').length, abertos:reds.filter(r => r.status === 'pendente' || r.status === 'separacao').length,
      spent:reds.filter(r => r.status !== 'recusada').reduce((s, r) => s + (r.cost || 0), 0),
      topTasks:top(ok, 'taskTitle'), topItems:top(reds.filter(r => r.status !== 'recusada'), 'itemName')
    };
  } catch(e) { console.error(e); S.kpi = { error:true }; }
  S.kpiLoading = false; renderKpis();
}

/* ---------- Ações ---------- */
async function guard(fn){
  if (S.busy) return; S.busy = true;
  try { await fn(); }
  catch(e){ console.error(e); toast(e && e.code === 'permission-denied' ? 'O banco não permitiu esta ação para o seu acesso.' : e && e.code === 'resource-exhausted' ? 'Limite diário do plano gratuito do Firebase atingido. Tente amanhã.' : e && e.code === 'failed-precondition' ? 'Muita gente mexendo nisso agora. Tente de novo em alguns segundos.' : e && e.code === 'unavailable' ? 'Sem conexão com o banco. Verifique a internet.' : 'Não foi possível salvar. Tente de novo em instantes.'); }
  finally { S.busy = false; }
}

async function join(name, sector, wantSup){ await guard(async () => {
  await setDoc(doc(fdb, 'players', S.me), { name, sector, supRequest:!!wantSup, balance:0, earned:0, joinedAt:now(), email:S.email });
  S.tab = 'loja'; toast('Bem-vindo ao Unicoins!'); }); }

async function buy(id){ await guard(async () => {
  const p = me(); if (!p) return;
  const season = S.cfg.seasonKey;
  if (!season) return toast('A loja ainda não foi aberta pelo administrador.');
  const rid = id + '__' + S.me + '__' + season;
  const res = await runTransaction(fdb, async tx => {
    const pRef = doc(fdb, 'players', S.me), iRef = doc(fdb, 'items', id), rRef = doc(fdb, 'redemptions', rid);
    const ps = await tx.get(pRef), is = await tx.get(iRef), rs = await tx.get(rRef);
    if (!is.exists() || is.data().active !== true) return 'Este prêmio saiu da loja.';
    if (rs.exists() && rs.data().status !== 'recusada') return 'Você já resgatou este prêmio nesta temporada.';
    const it = is.data(), pl = ps.data(), b = pl.balance || 0;
    if (it.sector !== 'ambos' && it.sector !== pl.sector) return 'Este prêmio não é do seu setor.';
    if (b < it.cost) return 'Saldo insuficiente.';
    if (it.stock !== null && it.stock !== undefined && it.stock <= 0) return 'Este prêmio acabou de esgotar.';
    const t = now();
    tx.update(pRef, { balance:b - it.cost, lastRedemption:rid });
    if (it.stock !== null && it.stock !== undefined) tx.update(iRef, { stock:it.stock - 1, lastRedemption:rid });
    tx.set(rRef, { player:S.me, sector:pl.sector, item:id, itemName:it.name, emoji:it.emoji || '🎁', cost:it.cost, status:'pendente', season, at:t });
    tx.set(doc(collection(fdb, 'ledger')), { player:S.me, amount:-it.cost, kind:'redeem', reason:'Troca: ' + it.name, by:S.me, at:t, ref:rid });
    return null;
  });
  S.confirmId = null; fillStore();
  toast(res || 'Troca feita! Acompanhe a entrega em Meus resgates.'); }); }

async function adjust(pid, amount, reason, kind){
  return runTransaction(fdb, async tx => {
    const r = doc(fdb, 'players', pid), s = await tx.get(r);
    if (!s.exists()) return 0;
    const b = s.data().balance || 0;
    const real = amount < 0 ? -Math.min(-amount, Math.max(0, b)) : amount;
    if (!real) return 0;
    const k = kind || (real > 0 ? 'credit' : 'debit');
    tx.update(r, isEarnKind(k) ? { balance:b + real, earned:(s.data().earned || 0) + real } : { balance:b + real });
    tx.set(doc(collection(fdb, 'ledger')), { player:pid, amount:real, kind:k, reason, by:S.me, at:now() });
    return real;
  });
}
async function bulkCredit(ids, amt, why){
  for (let i = 0; i < ids.length; i += 200) {
    const batch = writeBatch(fdb), t = now();
    ids.slice(i, i + 200).forEach(pid => {
      batch.update(doc(fdb, 'players', pid), { balance:increment(amt), earned:increment(amt) });
      batch.set(doc(collection(fdb, 'ledger')), { player:pid, amount:amt, kind:'bulk', reason:why, by:S.me, at:t });
    });
    await batch.commit();
  }
}
async function resetPlayers(ids, reason){
  const targets = ids.map(id => S.players[id]).filter(p => p && ((p.balance || 0) !== 0 || (p.earned || 0) !== 0));
  for (let i = 0; i < targets.length; i += 200) {
    const batch = writeBatch(fdb), t = now();
    targets.slice(i, i + 200).forEach(p => {
      batch.update(doc(fdb, 'players', p.id), { balance:0, earned:0 });
      if (p.balance) batch.set(doc(collection(fdb, 'ledger')), { player:p.id, amount:-(p.balance || 0), kind:'reset', reason:reason || 'Moedas zeradas pela supervisão', by:S.me, at:t });
    });
    await batch.commit();
  }
  return targets.length;
}
async function endSeason(){ await guard(async () => {
  const key = S.cfg.seasonKey || 'S1', n = parseInt(key.slice(1), 10) || 1;
  const curName = S.cfg.seasonName || 'Temporada ' + n;
  const nextName = ($('#nextSeason') && $('#nextSeason').value.trim()) || 'Temporada ' + (n + 1);
  const ranking = {};
  ['fin', 'chat'].forEach(k => { ranking[k] = activePlayers().filter(p => p.sector === k && earned(p.id) > 0).sort((a, b) => earned(b.id) - earned(a.id)).slice(0, 10).map(p => ({ name:nm(p.id), earned:earned(p.id) })); });
  await setDoc(doc(fdb, 'seasons', key), { key, name:curName, startedAt:S.cfg.seasonStart || 0, endedAt:now(), ranking });
  await resetPlayers(Object.keys(S.players), 'Fim da ' + curName);
  await cfgWrite({ seasonKey:'S' + (n + 1), seasonName:nextName, seasonStart:now() });
  audit('Encerrou temporada', `${curName} encerrada; início da ${nextName}`);
  toast(`${curName} encerrada. Começou a ${nextName}!`); }); }

async function settle(rid, to){ await guard(async () => {
  const obs = (S.obs[rid] ?? '').trim().slice(0, 200);
  const msg = await runTransaction(fdb, async tx => {
    const rRef = doc(fdb, 'redemptions', rid), rs = await tx.get(rRef);
    const r = rs.exists() && rs.data();
    if (!r || r.status === 'entregue' || r.status === 'recusada') return 'Este pedido já foi resolvido por outra pessoa da supervisão.';
    if (to === 'separacao' && r.status !== 'pendente') return 'Este pedido já está em separação.';
    if (to === 'recusada') {
      const pRef = doc(fdb, 'players', r.player), iRef = doc(fdb, 'items', r.item);
      const ps = await tx.get(pRef), is = await tx.get(iRef);
      if (ps.exists()) tx.update(pRef, { balance:(ps.data().balance || 0) + r.cost });
      if (is.exists() && is.data().stock !== null && is.data().stock !== undefined) tx.update(iRef, { stock:is.data().stock + 1 });
      tx.set(doc(collection(fdb, 'ledger')), { player:r.player, amount:r.cost, kind:'refund', reason:'Estorno: ' + r.itemName, by:S.me, at:now() });
    }
    tx.update(rRef, { status:to, obs, doneBy:S.me, doneAt:now() });
    return { separacao:'Pedido marcado como em separação.', entregue:'Pedido marcado como entregue.', recusada:'Pedido recusado e Unicoins devolvidos.' }[to] + '|' + nm(r.player) + ' · ' + r.itemName;
  });
  const [m, det] = String(msg).split('|');
  if (det) { audit({ separacao:'Pedido em separação', entregue:'Pedido entregue', recusada:'Pedido recusado e estornado' }[to], det); delete S.obs[rid]; }
  toast(m); }); }

async function decide(id, ok){ await guard(async () => {
  const reason = ok ? '' : (S.reasons[id] || '').trim().slice(0, 200);
  const msg = await runTransaction(fdb, async tx => {
    const sRef = doc(fdb, 'submissions', id), ss = await tx.get(sRef);
    const x = ss.exists() && ss.data();
    if (!x || x.status !== 'pendente') return 'Esta entrega já foi conferida por outra pessoa da supervisão.';
    let pRef, ps;
    if (ok) { pRef = doc(fdb, 'players', x.player); ps = await tx.get(pRef); }
    if (ok && ps.exists()) {
      const p = ps.data();
      tx.update(pRef, { balance:(p.balance || 0) + x.reward, earned:(p.earned || 0) + x.reward });
      tx.set(doc(fdb, 'ledger', 'task_' + id), { player:x.player, amount:x.reward, kind:'task', reason:'Tarefa: ' + x.taskTitle, by:S.me, at:now() });
    }
    tx.update(sRef, { status:ok ? 'aprovada' : 'recusada', reason, doneBy:S.me, doneAt:now() });
    return (ok ? `${fmt(x.reward)} Unicoins creditados para ${nm(x.player)}.` : 'Entrega recusada.') + '|' + nm(x.player) + ' · ' + x.taskTitle;
  });
  const [m, det] = String(msg).split('|');
  if (det) audit(ok ? 'Aprovou entrega' : 'Recusou entrega', det + (reason ? ' · ' + reason : ''));
  delete S.reasons[id]; toast(m); }); }

function readImage(file, maxLen = 110000){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
  let max = 720, q = .85, out = '';
  for (let k = 0; k < 7; k++) { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', q); if (out.length < maxLen) break; max *= .8; q = Math.max(.5, q - .08); }
  res(out); }; img.src = fr.result; }; fr.readAsDataURL(file); }); }

function downloadCSV(name, header, rows){
  const cell = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '\ufeff' + [header, ...rows].map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `unicoins-${name}-${toDateInput(now())}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    const data = { title, desc:$('#tDesc').value.trim(), reward, sector, audience, deadlineAt, proof:$('#tProof').checked, repeat:$('#tRepeat').checked, active:$('#tActive').checked, updatedAt:now(), updatedBy:S.me };
    if (S.editingTask) { await updateDoc(doc(fdb, 'tasks', S.editingTask), data); audit('Editou tarefa', title); toast('Tarefa atualizada.'); }
    else { await addDoc(collection(fdb, 'tasks'), { ...data, createdAt:now() }); audit('Criou tarefa', `${title} · +${reward} · para ${S.tMode === 'pessoas' ? audience.length + ' pessoa(s)' : secName(sector)}`); toast('Tarefa publicada.'); }
    resetTaskForm();
  });
  if (f.id === 'itemForm') return guard(async () => {
    const cost = parseInt($('#fCost').value, 10), st = $('#fStock').value.trim(), name = $('#fName').value.trim();
    if (!name || !(cost > 0)) return toast('Informe o nome e um custo maior que zero.');
    const data = { name, desc:$('#fDesc').value.trim(), emoji:$('#fEmoji').value.trim() || '🎁', cost, stock:st === '' ? null : Math.max(0, parseInt(st, 10) || 0),
      sector:$('#fSector').value, active:$('#fActive').checked, image:safeImg(S.formImg), updatedAt:now(), updatedBy:S.me };
    if (S.editing) { await updateDoc(doc(fdb, 'items', S.editing), data); audit('Editou prêmio', `${name} · ${cost} moedas`); toast('Prêmio atualizado na loja.'); }
    else { await addDoc(collection(fdb, 'items'), { ...data, createdAt:now() }); audit('Criou prêmio', `${name} · ${cost} moedas · ${secName(data.sector)}`); toast('Prêmio adicionado à loja.'); }
    resetForm();
  });
  if (f.id === 'coinForm') return guard(async () => {
    const dir = +((e.submitter && e.submitter.dataset.dir) || 1), pid = $('#cTarget').value, amt = parseInt($('#cAmt').value, 10), why = $('#cWhy').value.trim();
    if (!pid || !(amt > 0) || !why) return toast('Escolha o colaborador, a quantidade e o motivo.');
    const real = await adjust(pid, dir * amt, why);
    if (!real) return toast(`${nm(pid)} não tem saldo para debitar.`);
    audit(real > 0 ? 'Creditou moedas' : 'Debitou moedas', `${nm(pid)} · ${real > 0 ? '+' : ''}${real} · ${why}`);
    toast(`${real > 0 ? 'Creditados' : 'Debitados'} ${fmt(Math.abs(real))} Unicoins ${real > 0 ? 'para' : 'de'} ${nm(pid)}.`); $('#cAmt').value = ''; $('#cWhy').value = '';
  });
  if (f.id === 'bulkForm') return guard(async () => {
    const sec = $('#bSector').value, amt = parseInt($('#bAmt').value, 10), why = $('#bWhy').value.trim();
    if (!(amt > 0) || !why) return toast('Informe a quantidade e o motivo.');
    const ps = activePlayers().filter(p => p.sector === sec && !supIds().includes(p.id));
    if (!ps.length) return toast('Ninguém deste setor entrou na loja ainda.');
    await bulkCredit(ps.map(p => p.id), amt, why);
    audit('Creditou setor inteiro', `${SECT[sec].name} · +${amt} para ${ps.length} pessoas · ${why}`);
    toast(`${fmt(amt)} Unicoins creditados para ${ps.length} pessoas do ${SECT[sec].name}.`); f.reset();
  });
});
</script>
</body>
</html>
